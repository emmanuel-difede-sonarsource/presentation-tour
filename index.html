<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonar Coding Loops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;1,500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F6FB;
    --purple: #290042;
    --blue: #126ED3;
    --blue-hover: #0C5DB5;
    --uranium: #B7D3F2;
    --n8: #3B3F44;
    --n6: #A8B3C2;
    --label: #8A94A3;
    --amber: #F5A524;
    --red: #D3121D;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--n8); font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage > div, #stage canvas { position: absolute; inset: 0; }
  #css { pointer-events: none; }
  .act { pointer-events: auto; cursor: pointer; }
  body.dragging, body.dragging .act { cursor: grabbing; }

  /* ---------- 3D layer: overview ---------- */
  .ttl { width: 6400px; color: #0B0B0F; user-select: none; }
  .ttl h1 { font: 500 300px/1 Lora, serif; margin: 0; letter-spacing: -3px; }
  .ttl.act { pointer-events: none !important; }   /* only the headline text is clickable, not the block's empty width */
  .ttl > * { width: fit-content; }
  .ttl.live > * { pointer-events: auto; }
  .ttl h1 .ne { color: var(--blue); }
  .ttl p { max-width: 5600px; margin: 48px 0 0; font: 400 92px/1.35 Inter, sans-serif; color: var(--n8); }
  .ttl p b { font-weight: 600; color: var(--purple); }
  .lbox { font: 400 100px 'IBM Plex Mono', monospace; letter-spacing: 6px; text-transform: uppercase; color: #6C7889;
          border: 6px solid #A3ADBB; padding: 18px 64px; background: rgba(243,246,251,.9); white-space: nowrap;
          transition: border-color .25s, color .25s, background .25s; }
  .lbox:hover { border-color: var(--blue); color: var(--blue); background: #fff; }
  .stl { font: 400 96px 'IBM Plex Mono', monospace; color: var(--label); white-space: nowrap; user-select: none; }
  .gitl { font: 700 132px/1.05 'IBM Plex Mono', monospace; color: #000; text-align: center; user-select: none; }
  .gitl span { display: inline-block; transition: transform .3s ease, color .3s ease; }
  .gitl.flash span { transform: scale(1.16); color: var(--blue); }

  .wm { display: inline-flex; align-items: center; gap: .3em; font-family: Poppins, Inter, sans-serif; font-size: 88px; white-space: nowrap; color: var(--purple); user-select: none; }
  /* logo height 1.6em; the assembled lockup (mark + text) follows the official SonarQube logo proportions */
  .wm .lg { height: 1.6em; width: auto; flex: none; }
  .wm .lg.gitar { height: 1.41em; }
  .wm .sep { width: 4px; height: 1.2em; margin: 0 .2em; flex: none; border-radius: 2px; background: rgba(18,110,211,.25); }
  .wm .mk { width: auto; height: 1.6em; flex: none; }
  .wm .wt { display: flex; flex-direction: column; line-height: 1; font-size: .77em; }
  .wm b { font-weight: 500; color: var(--purple); }
  .wm em { font-style: normal; font-weight: 500; color: var(--blue); }
  .wm small { font-size: .72em; font-weight: 400; color: var(--blue); margin-top: .12em; }
  .wmhit { padding: 14px 24px; border-radius: 24px; transition: background .25s; }
  .wmhit:hover { background: rgba(18,110,211,.08); }

  /* ---------- 3D layer: loop focus ---------- */
  .tagline { width: 1380px; text-align: center; font: italic 500 54px/1.3 Lora, serif; color: var(--purple); user-select: none; }
  .chip { font: 500 40px 'IBM Plex Mono', monospace; letter-spacing: 5px; color: var(--blue); text-transform: uppercase; white-space: nowrap; user-select: none; }
  .cap { box-sizing: border-box; width: 740px; font: 400 33px/1.4 Inter, sans-serif; color: var(--n8); background: rgba(255,255,255,.94);
         padding: 24px 30px; border-left: 7px solid var(--blue); border-radius: 10px; box-shadow: 0 14px 40px rgba(41,0,66,.08); user-select: none; }
  .cap b { display: block; font: 600 28px 'IBM Plex Mono', monospace; letter-spacing: 4px; color: var(--blue); text-transform: uppercase; margin-bottom: 8px; }
  .cap.r { border-left: none; border-right: 7px solid var(--blue); text-align: right; }
  .cap.top { width: 1300px; text-align: center; border-left: none; border-top: 7px solid var(--blue); }
  .card { box-sizing: border-box; height: 320px; background: #fff; border: 3px solid #DFE6F0; border-radius: 28px; padding: 32px 36px;
          box-shadow: 0 20px 50px rgba(41,0,66,.10); display: flex; flex-direction: column; gap: 18px; user-select: none;
          transition: border-color .25s, box-shadow .25s; }
  .card:hover { border-color: var(--blue); box-shadow: 0 26px 64px rgba(18,110,211,.24); }
  .card .wm { font-size: 46px; }
  .card p { margin: 0; font: 600 32px/1.3 Inter, sans-serif; color: var(--purple); }
  .card .more { margin-top: auto; font: 500 22px 'IBM Plex Mono', monospace; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; }

  /* ---------- 3D layer: product detail ---------- */
  .panel { box-sizing: border-box; width: 1700px; background: #fff; border-radius: 40px; padding: 60px 72px 64px; position: relative;
           border: 3px solid #E3E9F2; box-shadow: 0 60px 140px rgba(41,0,66,.22); font-family: Inter, sans-serif; color: var(--n8); }
  .panel .x { position: absolute; top: 40px; right: 44px; width: 76px; height: 76px; border-radius: 50%; border: 3px solid #DFE6F0;
              background: #fff; font: 400 36px Inter, sans-serif; color: var(--n8); display: grid; place-items: center; }
  .panel .x:hover { border-color: var(--blue); color: var(--blue); }
  .panel .ph { display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-right: 110px; }
  .panel .wm { font-size: 84px; }
  .panel .wm.duo { font-size: 60px; }
  .panel .lc { font: 500 28px/1.5 'IBM Plex Mono', monospace; letter-spacing: 4px; color: var(--blue); text-transform: uppercase; text-align: right; }
  .panel h2 { font: 500 60px/1.2 Lora, serif; color: var(--purple); margin: 30px 0 44px; }
  .panel .cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 64px; }
  .panel h4 { font: 600 25px 'IBM Plex Mono', monospace; letter-spacing: 5px; color: var(--label); text-transform: uppercase; margin: 0 0 20px; }
  .panel ul { margin: 0 0 40px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .panel li { font: 400 30px/1.42 Inter, sans-serif; padding-left: 46px; position: relative; }
  .panel li::before { content: ''; position: absolute; left: 4px; top: .35em; width: 22px; height: 12px; border-left: 5px solid var(--blue); border-bottom: 5px solid var(--blue); transform: rotate(-45deg); }
  .panel code { font: 500 .9em 'IBM Plex Mono', monospace; background: #F3F6FB; padding: 2px 10px; border-radius: 8px; color: var(--purple); }
  .runs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
  .run { background: var(--bg); border-radius: 20px; padding: 22px 26px; font: 400 25px/1.42 Inter, sans-serif; }
  .run b { display: block; font: 600 25px Inter, sans-serif; color: var(--purple); margin-bottom: 8px; }
  .gear { flex: none; color: var(--purple); }
  .gear g { transform-origin: 20px 20px; animation: gear-spin 8s linear infinite; }
  @keyframes gear-spin { to { transform: rotate(360deg); } }
  .pr { border: 3px solid #DFE6F0; border-radius: 24px; padding: 0 26px 26px; margin-bottom: 40px; }
  .pr-h { display: flex; align-items: center; gap: 14px; margin: 0 -26px 24px; padding: 18px 26px; border-bottom: 3px solid #DFE6F0;
          font: 600 25px 'IBM Plex Mono', monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--purple); }
  .pr-h svg { width: 38px; height: 38px; color: var(--blue); }
  .pr-l { background: var(--bg); border-radius: 18px; border-left: 8px solid var(--blue); padding: 20px 26px; font: 400 25px/1.42 Inter, sans-serif; }
  .pr-l:first-of-type { border-left-color: var(--purple); }
  .pr-n { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; font: 400 30px Poppins, Inter, sans-serif; color: var(--purple); }
  .pr-n b { font-weight: 500; }
  .pr-n img { display: block; height: 44px; }
  .pr-wip { display: flex; align-items: center; gap: 18px; padding: 6px 0 6px 28px; color: var(--purple); font: 400 23px/1.4 Inter, sans-serif; }
  .pr-wip b { display: block; font: 600 21px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
  .pr-wip .gear { width: 48px; height: 48px; }
  .pr-wip .arr { flex: none; width: 36px; height: 110px; overflow: visible; }
  .pr-wip .dots { stroke-width: 8; stroke-dasharray: 0 15; animation: wip-flow 1.6s ease-in-out infinite alternate; }
  @keyframes wip-flow { from { stroke-dashoffset: 15px; } to { stroke-dashoffset: -15px; } }
  .slider { pointer-events: auto; margin-top: 8px; padding-top: 40px; border-top: 3px solid #E3E9F2; }
  .slider input { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 72px; margin: 0; background: none; cursor: grab; }
  .slider input:active { cursor: grabbing; }
  .slider input::-webkit-slider-runnable-track { height: 16px; border-radius: 999px;
    background: linear-gradient(90deg, var(--purple), var(--blue)) 0 / var(--v, 0%) 100% no-repeat, #E3E9F2; }
  .slider input::-moz-range-track { height: 16px; border-radius: 999px;
    background: linear-gradient(90deg, var(--purple), var(--blue)) 0 / var(--v, 0%) 100% no-repeat, #E3E9F2; }
  .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 64px; height: 64px; margin-top: -24px; border-radius: 50%;
    background: #fff; border: 8px solid var(--blue); box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .slider input::-moz-range-thumb { box-sizing: border-box; width: 64px; height: 64px; border-radius: 50%;
    background: #fff; border: 8px solid var(--blue); box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .slider .stops { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; }
  .slider .stops span { font: 600 25px 'IBM Plex Mono', monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--label); transition: color .25s; }
  .slider .stops span:nth-child(2) { text-align: center; }
  .slider .stops span:nth-child(3) { text-align: right; }
  .slider .stops span.on { color: var(--purple); }
  .slider p { font: italic 500 40px/1.3 Lora, serif; color: var(--purple); margin: 28px 0 0; text-align: center; min-height: 1.3em; }
  /* autonomy schema under the slider: who acts at each PR step (data-who), steps lit in turn left to right */
  .auto { display: flex; align-items: center; gap: 10px; margin-top: 36px; --T: 4s; }
  .auto > svg { flex: none; width: 64px; height: 28px; color: var(--blue); overflow: visible; }
  .auto > svg .dash { stroke-dasharray: 10 9; animation: hunt-flow 1.1s linear infinite; }
  .auto .as { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 16px 26px;
              border: 3px solid #DFE6F0; border-top: 8px solid var(--c, var(--blue)); border-radius: 22px; background: var(--bg);
              transition: border-top-color .4s; animation: auto-step var(--T) ease-out calc(var(--d) * var(--T) / 4) infinite; }
  .auto .as[data-who="team"] { --c: var(--purple); }
  .auto .as[data-who="agent"] { --c: var(--amber); }
  .auto .as > b { font: 600 25px 'IBM Plex Mono', monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--label); }
  .auto .who { display: grid; height: 96px; }
  .auto .who > span { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
                      opacity: 0; transform: scale(.85); transition: opacity .35s, transform .35s; color: var(--c); }
  .auto .who svg { width: 60px; height: 60px; }
  .auto .who img { display: block; height: 52px; }
  .auto .who small { font: 600 21px Inter, sans-serif; color: var(--purple); white-space: nowrap; }
  .auto .as[data-who="team"] .team, .auto .as[data-who="gitar"] .gitar, .auto .as[data-who="agent"] .agent { opacity: 1; transform: none; }
  .auto .as em { position: absolute; bottom: -20px; font: normal 600 17px 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase;
                 color: #fff; background: var(--purple); border-radius: 999px; padding: 6px 14px; white-space: nowrap; opacity: 0; transition: opacity .35s; }
  .auto .as.req em { opacity: 1; }
  @keyframes auto-step { 0% { background: #fff; box-shadow: 0 0 0 0 rgba(18,110,211,.4); }
                         16% { background: #fff; box-shadow: 0 0 0 18px rgba(18,110,211,0); }
                         24%, 100% { background: var(--bg); box-shadow: none; } }
  .runs.link { display: flex; align-items: center; }
  .runs.link .run { flex: 1; }
  .link-arrow { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--blue); font: 500 21px Inter, sans-serif; white-space: nowrap; }
  .link-arrow svg { width: 110px; height: 24px; }
  .link-logos { display: flex; flex-direction: column; gap: 24px; }
  .link-logos img { display: block; height: 50px; }
  .sca { width: 710px; margin-bottom: 40px; font: 400 21px/1.3 Inter, sans-serif; }
  .sca .nd { display: flex; align-items: center; gap: 18px; border-radius: 22px; padding: 18px 24px; background: var(--bg); }
  .sca .nd > svg { flex: none; width: 52px; height: 52px; color: var(--purple); }
  .sca .nd > img { display: block; height: 60px; }
  .sca .nd > span { display: flex; flex-direction: column; gap: 4px; }
  .sca .nd b { font: 600 26px Inter, sans-serif; color: var(--purple); }
  .sca .nd small { font: 400 18px/1.3 Inter, sans-serif; color: var(--n8); }
  .sca .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-left: auto; }
  .sca .chips span { font: 500 18px 'IBM Plex Mono', monospace; color: var(--blue); background: #fff; border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
  .sca .be { display: block; border: 3px solid var(--purple); background: #fff; padding: 20px 22px 22px; }
  .sca .be-h { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .sca .be-h svg { flex: none; width: 52px; height: 52px; color: var(--purple); }
  .sca .be-h b { font: 600 28px Poppins, Inter, sans-serif; }
  .sca .be-h em { margin-left: auto; font: italic 500 17px Inter, sans-serif; color: var(--blue); text-align: right; }
  .sca .steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .sca .st { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 3px solid transparent; border-radius: 18px; background: var(--bg);
             animation: sca-step var(--T) ease-out var(--d) infinite; }
  .sca .st svg { flex: none; width: 40px; height: 40px; color: var(--blue); }
  .sca .st span { display: flex; flex-direction: column; gap: 2px; }
  .sca .st b { font: 600 21px/1.2 Inter, sans-serif; }
  .sca .st small { font-size: 16px; }
  @keyframes sca-step { 0% { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 0 rgba(18,110,211,.45); }
                        14% { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 16px rgba(18,110,211,0); }
                        20%, 100% { background: var(--bg); border-color: transparent; box-shadow: none; } }
  .sca > svg { display: block; width: 100%; height: auto; overflow: visible; color: var(--blue); }
  .sca > svg .dash { stroke-dasharray: 10 9; animation: hunt-flow 1.1s linear infinite; }
  .sca > svg text { font: 500 19px Inter, sans-serif; fill: var(--label); }
  .hunt { margin-bottom: 40px; font-family: Inter, sans-serif; }
  .hunt .hn { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 auto; width: 64%; box-sizing: border-box;
              border-radius: 20px; padding: 18px 24px; text-align: center; background: var(--bg); color: var(--n8); font: 400 23px/1.3 Inter, sans-serif; }
  .hunt .hn b { font: 600 26px Inter, sans-serif; color: var(--purple); }
  .hunt .hn.start { background: var(--purple); color: #fff; }
  .hunt .hn.report { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #fff; }
  .hunt .hn.start b, .hunt .hn.report b { color: #fff; }
  .hunt svg { display: block; width: 100%; height: auto; color: var(--blue); overflow: visible; }
  .hunt svg .dash { stroke-dasharray: 10 9; animation: hunt-flow 1.1s linear infinite; }
  @keyframes hunt-flow { to { stroke-dashoffset: -19; } }
  .hunt .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .hunt .lane { display: flex; flex-direction: column; align-items: stretch; gap: 0; border: 3px solid #DFE6F0; border-top: 7px solid var(--blue);
                border-radius: 20px; padding: 16px 16px 18px; background: #fff; }
  .hunt .lane b { font: 600 23px/1.25 Inter, sans-serif; color: var(--purple); text-align: center; min-height: 2.5em; display: grid; place-items: center; margin-bottom: 12px; }
  .hunt .lane span { font: 500 19px 'IBM Plex Mono', monospace; color: var(--blue); background: var(--bg); border-radius: 999px; padding: 8px 10px; text-align: center; }
  .hunt .lane svg { width: 24px; height: 26px; margin: 4px auto; }
  .hunt .lane .try { display: flex; align-self: center; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; padding: 8px 18px;
                     border: 2px solid var(--blue); border-radius: 999px; background: #fff; color: var(--blue); transition: background .25s, color .25s; }
  .hunt .lane .try:hover { background: var(--blue); color: #fff; }
  .hunt .lane .try svg { width: 16px; height: 16px; margin: 0; flex: none; }
  .hunt .lane .try i { font: normal 600 17px 'IBM Plex Mono', monospace; letter-spacing: 1px; }

  /* example animation over the product panel: sequence diagram + flagged code, revealed step by step (.on) */
  .demo { position: absolute; inset: 0; z-index: 5; box-sizing: border-box; padding: 60px 72px 52px; border-radius: 40px; background: #fff;
          display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  .demo.open { opacity: 1; visibility: inherit; pointer-events: auto; transition: opacity .35s; }
  .demo.rs, .demo.rs * { transition: none !important; }
  .demo .dh { display: flex; align-items: center; gap: 22px; margin-right: 110px; font: 500 27px Inter, sans-serif; color: var(--n8); }
  .demo .cwe { font: 600 25px 'IBM Plex Mono', monospace; letter-spacing: 2px; color: #fff; background: var(--red); border-radius: 999px; padding: 6px 20px; }
  .demo h3 { font: 500 54px/1.2 Lora, serif; color: var(--purple); margin: 24px 0 40px; }
  .demo .dm { display: grid; grid-template-columns: 1fr 1.1fr; gap: 56px; align-items: start; }
  .demo .actors { display: grid; grid-template-columns: repeat(var(--n), 1fr); }
  .demo .actor { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: var(--purple); }
  .demo .actor i { display: grid; place-items: center; width: 92px; height: 92px; margin-bottom: 8px; border-radius: 50%; border: 4px solid currentColor; background: var(--bg); }
  .demo .actor svg { width: 50px; height: 50px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .demo .actor.attacker { color: var(--red); }
  .demo .actor.api, .demo .actor.db, .demo .actor.pay { color: var(--blue); }
  .demo .actor b { font: 600 26px Inter, sans-serif; color: var(--purple); }
  .demo .actor small { font: 400 20px Inter, sans-serif; color: var(--label); }
  .demo .msgs { position: relative; padding: 14px 0 10px; }
  .demo .life { position: absolute; top: 0; bottom: 0; border-left: 3px dashed #D4D4D4; transform: translateX(-1.5px); }
  .demo .m { position: relative; height: 84px; color: var(--blue); }
  .demo .m.bad, .demo .m.leak { color: var(--red); }
  .demo .m.skip { color: var(--n6); }
  .demo .ln { position: absolute; bottom: 18px; height: 5px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .55s ease; }
  .demo .m.rtl .ln { transform-origin: right; }
  .demo .m.res .ln, .demo .m.leak .ln, .demo .m.skip .ln { background: repeating-linear-gradient(90deg, currentColor 0 14px, transparent 14px 24px); }
  .demo .ln::after { content: ''; position: absolute; top: -9px; right: -4px; border: 11.5px solid transparent; border-right: none; border-left: 18px solid currentColor; }
  .demo .m.rtl .ln::after { right: auto; left: -4px; border-left: none; border-right: 18px solid currentColor; }
  .demo .m.skip .ln::before { content: '✕'; position: absolute; left: 80%; top: -22px; transform: translateX(-50%); font: 700 36px Inter, sans-serif; color: var(--red); }
  .demo .lb { position: absolute; bottom: 32px; display: flex; justify-content: center; white-space: nowrap; opacity: 0; transform: translateY(10px);
              transition: opacity .35s .3s, transform .35s .3s; }
  .demo .lb span { font: 500 21px 'IBM Plex Mono', monospace; color: var(--purple); background: #fff; padding: 2px 10px; border-radius: 8px; }
  .demo .m.bad .lb span, .demo .m.leak .lb span { color: var(--red); }
  .demo .m.skip .lb span { color: var(--label); text-decoration: line-through; }
  .demo .lb b { font-weight: 700; }
  .demo .m.on .ln { transform: none; }
  .demo .m.on .lb { opacity: 1; transform: none; }
  .demo .m.cur.bad .lb span, .demo .m.cur.leak .lb span { box-shadow: 0 0 0 3px var(--red); }
  .demo .m.cur .lb span { box-shadow: 0 0 0 3px var(--uranium); }
  .demo .code { border: 3px solid #E3E9F2; border-radius: 24px; overflow: hidden; }
  .demo .fh { padding: 14px 26px; background: var(--bg); border-bottom: 3px solid #E3E9F2; font: 500 20px 'IBM Plex Mono', monospace; color: var(--label); }

function makeNode(pos, { r0 = 0.3, r1 = 0.43, color = BLUE } = {}) {

const arcSeg = (L, a0, a1) => ({
  len: R * Math.abs(deg(a1 - a0)),

});

const tokens = [];
function spawnLoopToken(i, offset) {
  const L = LOOPS[i];
  tokens.push({ route: [arcSeg(L, 90, 90 + L.dir * 360)], idx: 0, s: offset, dist: 1e9, repeat: true,
                speed: 3.2, size: 0.55, col: BLUE.clone(), target: BLUE, fade: 1 });
}
function spawnJourney() {
  if (tokens.length >= MAX_TOKENS) return;
  // Guide → Verify → Solve (fix) → Guide → Verify → git push → CI loop → git merge → one maintenance cycle
  tokens.push({ route: [arcSeg(L1, 215, -270), curveSeg(pushCurve), arcSeg(L2, 215, 350), curveSeg(mergeCurve), arcSeg(L3, 90, -270)],
                idx: 0, s: 0, dist: 0, repeat: false, speed: 6.2, size: 0.95, col: AMBER.clone(), target: AMBER, fade: 1, journey: true });
}
LOOPS.forEach((_, i) => { spawnLoopToken(i, 0); spawnLoopToken(i, Math.PI * R); });

const _v = new THREE.Vector3();
function tokenPos(tk, back, out) {
  let i = tk.idx, s = tk.s - back;
  while (s < 0) {
    if (i > 0) { i--; s += tk.route[i].len; }
    else if (tk.repeat) { i = tk.route.length - 1; s += tk.route[i].len; }
    else { s = 0; break; }
  }
  return tk.route[i].at(s, out);
}
function advanceToken(tk, dt) {
  if (tk.ended) { tk.fade -= dt * 1.4; return; }
  tk.s += tk.speed * dt; tk.dist += tk.speed * dt;
  while (tk.s > tk.route[tk.idx].len) {
    tk.s -= tk.route[tk.idx].len; tk.idx++;
    if (tk.idx >= tk.route.length) {
      if (tk.repeat) tk.idx = 0;
      else { tk.idx = tk.route.length - 1; tk.s = tk.route[tk.idx].len; tk.ended = true; break; }
    }
  }
  tk.col.lerp(tk.target, Math.min(1, dt * 3));
  tokenPos(tk, 0, _v);
  for (const n of nodes) {
    if (n.pulse < 0.35 && _v.distanceToSquared(n.pos) < 0.3) {
      n.pulse = 1;
      if (tk.journey && n.type === 'solve') tk.target = BLUE;   // fixed → verified
    }
  }
  if (tk.journey) for (const c of connectors) {
    if (c.node.pulse < 0.35 && Math.hypot(_v.x - c.marker.x, _v.y - c.marker.y) < 0.6) {
      c.node.pulse = 1;
      c.labelEl.classList.add('flash');
      setTimeout(() => c.labelEl.classList.remove('flash'), 500);
    }
  }
}
function writeTokens(dims, run) {
  tAlpha.fill(0);
  tokens.forEach((tk, ti) => {
    for (let k = 0; k < TRAIL; k++) {
      const j = ti * TRAIL + k, back = k * TRAIL_GAP;
      if (!tk.repeat && back > tk.dist) continue;
      tokenPos(tk, back, _v);
      tPos[j * 3] = _v.x; tPos[j * 3 + 1] = _v.y; tPos[j * 3 + 2] = _v.z;
      tCol[j * 3] = tk.col.r; tCol[j * 3 + 1] = tk.col.g; tCol[j * 3 + 2] = tk.col.b;
      const f = 1 - k / TRAIL;
      const near = LOOPS.reduce((b, L, li) => Math.abs(_v.x - L.cx) < Math.abs(_v.x - LOOPS[b].cx) ? li : b, 0);
      tAlpha[j] = f * f * Math.max(0, tk.fade) * (0.25 + 0.75 * dims[near]) * run;
      tSize[j] = tk.size * (0.35 + 0.65 * f);
    }

/* =====================================================================

let Zo, Zf, Zd;
function fitZ(w, h) { const t = 2 * Math.tan(deg(camera.fov / 2)); return Math.max(h / t, w / (t * camera.aspect)); }
function computeFraming() { Zo = fitZ(76, 34); Zf = fitZ(48, 27.5); Zd = fitZ(20, 15.5); }

const cam = { x: 0, y: OY, z: 200 };
let flight = null;
function flyTo(to, dur = 1.5) {
  const from = { ...cam };
  const lateral = Math.hypot(to.x - from.x, to.y - from.y);
  const lift = Math.max(0, Math.min(lateral * 0.55, 30) - Math.abs(to.z - from.z) * 0.5);
  flight = { from, to, t: 0, dur, lift };
}

let state = { level: 'overview' };   // 'headline' = the overview title alone, everything else faded out
let solo = 0;                        // 0 → 1 while the headline is isolated
const tour = [{ level: 'overview' }];
LOOPS.forEach((L, i) => {
  tour.push({ level: 'loop', loop: i });
  L.products.forEach((p, j) => {
    tour.push({ level: 'product', loop: i, prod: j });
    p.deeps.forEach((_, d) => tour.push({ level: 'deep', loop: i, prod: j, sub: d }));
  });
});
const sameState = (a, b) => a.level === b.level && a.loop === b.loop && a.prod === b.prod && a.sub === b.sub;

/* ---------- example animations (Hunter Agent lanes) ---------- */
let demoOn = null;   // { el, D, k, auto, timer } of the open example
function demoShow(k) {

  el.querySelectorAll('[data-s]').forEach(e => { e.classList.toggle('on', +e.dataset.s <= k); e.classList.toggle('cur', +e.dataset.s === k); });
  // caption: the latest one at or before this step (the last step explains the finding)
  el.querySelector('.dcap').innerHTML = k === last ? D.finding[2] : D.steps.slice(0, k + 1).reverse().find(s => s[4])[4];
  if (k === last) demoAuto(false);   // played to the end: the button offers to play it again
  else if (demoOn.auto) demoOn.timer = setTimeout(() => demoShow(k + 1), D.steps[k][4] ? 2800 : 1700);   // longer pause on steps with a caption to read
}
// autoplay on by default, paused by ←/→, toggled by the play/pause button
function demoAuto(on) {

}
function demoPlay(el, D) {

  el.classList.add('open', 'rs');   // reset the reveal transitions, then play from the first step
  el.querySelectorAll('[data-s]').forEach(e => e.classList.remove('on', 'cur'));
  el.querySelector('.dcap').innerHTML = '';

}
function demoClose() {
  if (!demoOn) return;

function go(st) {
  demoClose();
  state = st;
  const mine = p => p.loopIdx === st.loop && p.prodIdx === st.prod;
  panels.forEach(p => { p.target = ((st.level === 'product' || st.level === 'deep') && mine(p)) ? 1 : 0; });
  deeps.forEach(p => { p.target = (st.level === 'deep' && mine(p) && p.subIdx === st.sub) ? 1 : 0; });
  document.body.classList.toggle('solo', st.level === 'headline');
  if (st.level === 'overview') flyTo({ x: 0, y: OY, z: Zo });
  else if (st.level === 'headline') {   // frame the headline text, left-aligned in its block
    const o = headline.o, w = Math.max(...[...headline.el.children].map(c => c.offsetWidth)) * S, h = headline.el.offsetHeight * S;
    flyTo({ x: o.position.x - headline.el.offsetWidth * S / 2 + w / 2, y: o.position.y, z: fitZ(w * 1.2, h * 1.6) }, 1.2);
  }
  else if (st.level === 'loop') flyTo({ x: LOOPS[st.loop].cx, y: FY, z: Zf });
  else if (st.level === 'product') {   // taller panels (e.g. the Remediation Agent feed diagram) back the camera off to fit
    const h = LOOPS[st.loop].products[st.prod].panel.el.offsetHeight * S;
    flyTo({ x: LOOPS[st.loop].cx, y: PY, z: PZ + Math.max(Zd, fitZ(20, h + 1.6)) }, 1.3);
  }
  else {   // taller deep dives (e.g. the Hunter Agent requirements) back the camera off to fit
    const h = LOOPS[st.loop].products[st.prod].panel.deeps[st.sub].el.offsetHeight * S;
    flyTo({ x: LOOPS[st.loop].cx, y: PY, z: PZ + DZ + Math.max(Zd, fitZ(20, h + 1.6)) }, 1.1);
  }

}
function step(d) {
  let k = tour.findIndex(t => sameState(t, state.level === 'headline' ? { level: 'overview' } : state));
  k = k < 0 ? 0 : (k + d + tour.length) % tour.length;
  go(tour[k]);
}
function back() {
  if (state.level === 'deep') go({ level: 'product', loop: state.loop, prod: state.prod });
  else if (state.level === 'product') go({ level: 'loop', loop: state.loop });
  else go({ level: 'overview' });
}

/* ---------- HUD ---------- */
const crumbsEl = document.getElementById('crumbs'), dotsEl = document.getElementById('dots');
const prodOf = st => LOOPS[st.loop].products[st.prod];
const deepOf = st => prodOf(st).deeps[st.sub];
dotsEl.innerHTML = tour.map((t, k) => `<i data-act="step:${k}" class="${{ product: '', deep: 'sub' }[t.level] ?? 'loop'}" title="${
  t.level === 'overview' ? 'Overview' : t.level === 'loop' ? LOOPS[t.loop].title
  : t.level === 'product' ? prodOf(t).name : `${prodOf(t).name} · ${deepOf(t).name}`}"></i>`).join('');
function updateHud() {
  const top = state.level === 'overview' || state.level === 'headline';
  const parts = [`<a data-act="overview" class="${top ? 'cur' : ''}">Overview</a>`];
  if (!top) parts.push(`<a data-act="loop:${state.loop}" class="${state.level === 'loop' ? 'cur' : ''}">${LOOPS[state.loop].title}</a>`);
  if (state.level === 'product') parts.push(`<a class="cur">${prodOf(state).name}</a>`);
  if (state.level === 'deep') parts.push(`<a data-act="prod:${state.loop}:${state.prod}">${prodOf(state).name}</a>`, `<a class="cur">${deepOf(state).name}</a>`);
  crumbsEl.innerHTML = parts.join('<span>›</span>');
  const k = top ? 0 : tour.findIndex(t => sameState(t, state));
  history.replaceState(null, '', location.pathname + location.search + (top ? '' : `#${state.loop + 1}${state.level === 'loop' ? '' : '.' + (state.prod + 1)}${state.level === 'deep' ? '.' + (state.sub + 1) : ''}`));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === k));

/* ---------- input ---------- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pointer = { x: 0, y: 0, down: null, moved: false };
let hovered = -1;

/* ---------- sway toggle ---------- */
const swayToggleEl = document.getElementById('swayToggle');
let swayOn = false;
swayToggleEl.addEventListener('click', () => {
  swayOn = !swayOn;
  swayToggleEl.classList.toggle('on', swayOn);
  swayToggleEl.setAttribute('aria-pressed', String(swayOn));
});

function act(a) {
  if (!a) return false;
  const [k, x, y, z] = a.split(':');
  if (k === 'loop') go({ level: 'loop', loop: +x });
  else if (k === 'prod') go({ level: 'product', loop: +x, prod: +y });
  else if (k === 'deep') go({ level: 'deep', loop: +x, prod: +y, sub: +z });
  else if (k === 'step') go(tour[+x]);
  else if (k === 'overview') go({ level: 'overview' });
  else if (k === 'headline') go({ level: state.level === 'headline' ? 'overview' : 'headline' });
  else if (k === 'close') back();
  else if (k === 'next') step(1);
  else if (k === 'prev') step(-1);
  else if (k === 'demo') { const p = LOOPS[+x].products[+y]; demoPlay(p.panel.el.querySelectorAll('.demo')[+z], p.pipeline.demos[+z]); }
  else if (k === 'demo-replay') demoPlay(demoOn.el, demoOn.D);
  else if (k === 'demo-toggle') demoOn.auto ? demoAuto(false) : demoOn.k === demoOn.D.steps.length ? demoPlay(demoOn.el, demoOn.D) : demoAuto(true);
  else if (k === 'demo-close') demoClose();
  return true;
}
function pickLoop(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(hitDiscs)[0];
  return hit ? hit.object.userData.loop : -1;
}
function syncStateFromCamera() {
  if (state.level === 'headline') return;
  const t = (cam.z - Zf) / (Zo - Zf);
  if (t > 0.7) { if (state.level !== 'overview') { state = { level: 'overview' }; updateHud(); } return; }
  const near = LOOPS.reduce((b, L, i) => Math.abs(cam.x - L.cx) < Math.abs(cam.x - LOOPS[b].cx) ? i : b, 0);
  if (t < 0.35 && Math.abs(cam.x - LOOPS[near].cx) < 8 && state.level === 'overview') { state = { level: 'loop', loop: near }; updateHud(); }
}

addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = e.clientY / innerHeight * 2 - 1;
  if (pointer.down) {
    const dx = e.clientX - pointer.down.x, dy = e.clientY - pointer.down.y;
    if (Math.hypot(dx, dy) > 5) { pointer.moved = true; document.body.classList.add('dragging'); }
    if (pointer.moved) {
      const k = 2 * cam.z * Math.tan(deg(camera.fov / 2)) / innerHeight;
      cam.x = pointer.down.cx - dx * k; cam.y = pointer.down.cy + dy * k; flight = null;
    }
    return;
  }
  hovered = state.level === 'headline' || e.target.closest('#hud,#legend,#swayToggle') ? -1 : pickLoop(e.clientX, e.clientY);
  document.body.style.cursor = hovered >= 0 && !(state.level === 'loop' && state.loop === hovered) ? 'pointer' : '';
});
addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('#hud,#legend,.slider,.demo,#swayToggle')) return;
  pointer.down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; pointer.moved = false;
});
addEventListener('pointerup', e => {
  const wasDown = pointer.down; pointer.down = null; document.body.classList.remove('dragging');
  if (pointer.moved) { pointer.moved = false; syncStateFromCamera(); return; }
  if (act(e.target.closest('[data-act]')?.dataset.act)) return;
  if (!wasDown || state.level === 'headline') return;
  const i = pickLoop(e.clientX, e.clientY);
  if (i >= 0 && !(state.level === 'loop' && state.loop === i)) go({ level: 'loop', loop: i });
});
addEventListener('dblclick', e => { if (!e.target.closest('[data-act],#hud,.slider,.demo,#swayToggle')) back(); });
addEventListener('wheel', e => {
  e.preventDefault();
  flight = null;
  const factor = Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
  if (factor > 1 && state.level === 'headline') { go({ level: 'overview' }); return; }   // zooming out brings the whole overview back
  if (factor > 1 && (state.level === 'product' || state.level === 'deep')) {
    demoClose();
    [...panels, ...deeps].forEach(p => { p.target = 0; }); state = { level: 'loop', loop: state.loop }; updateHud();
  }
  const halfH = cam.z * Math.tan(deg(camera.fov / 2));
  const px = cam.x + (e.clientX / innerWidth * 2 - 1) * halfH * camera.aspect;
  const py = cam.y - (e.clientY / innerHeight * 2 - 1) * halfH;
  const z = clamp(cam.z * factor, 6, Zo * 1.7), k = z / cam.z;
  cam.x = px + (cam.x - px) * k; cam.y = py + (cam.y - py) * k; cam.z = z;

}, { passive: false });
addEventListener('keydown', e => {
  if (demoOn) {   // an open example takes ←/→ (pause autoplay and step through it, → on the last step closes it) and Esc
    const d = ['ArrowRight', 'PageDown', ' '].includes(e.key) ? 1 : ['ArrowLeft', 'PageUp'].includes(e.key) ? -1 : 0;
    if (d || e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault();
      if (!d || (d > 0 && demoOn.k === demoOn.D.steps.length)) demoClose(); else { demoAuto(false); demoShow(demoOn.k + d); }
      return;
    }
  }
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); step(1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === 'Escape' || e.key === 'Backspace') back();
  else if (e.key === '0' || e.key === 'Home') go({ level: 'overview' });
  else if (['1', '2', '3'].includes(e.key)) go({ level: 'loop', loop: +e.key - 1 });

});
setTimeout(() => { document.getElementById('help').style.opacity = 0.45; }, 9000);

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); cssRenderer.setSize(w, h);
  lineMats.forEach(m => m.resolution.set(w, h));
  tokMat.uniforms.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(deg(camera.fov / 2)));

}
addEventListener('resize', () => { onResize(); go(state); });
onResize();

/* =====================================================================
   Frame loop
   ===================================================================== */
const clock = new THREE.Clock();
const _p = new THREE.Vector3(), _t = new THREE.Vector3();
let spawnTimer = 0.4, elapsed = 0;
// deep links: #2 → loop 2, #2.1 → loop 2, first product, #2.2.1 → that product's first deep dive
function stateFromHash() {
  const m = location.hash.match(/^#([1-3])(?:\.([1-9])(?:\.([1-9]))?)?$/);
  if (!m) return { level: 'overview' };
  const loop = +m[1] - 1, prod = m[2] ? +m[2] - 1 : undefined;
  const p = prod !== undefined && LOOPS[loop].products[prod];
  if (!p) return { level: 'loop', loop };
  const sub = m[3] ? +m[3] - 1 : -1;
  return sub >= 0 && p.deeps[sub] ? { level: 'deep', loop, prod, sub } : { level: 'product', loop, prod };
}
cam.z = Zo * 2.3;
cssRenderer.render(cssScene, camera);   // attach the CSS items so panel heights can be measured
go(stateFromHash());
flight.dur = 2.6;
if (new URLSearchParams(location.search).has('instant')) {   // skip intro flight + panel animation (screenshots, slow machines)
  Object.assign(cam, flight.to); flight = null; [...panels, ...deeps].forEach(p => { p.k = p.target; });
}

function setOpacity(item, a) {
  const vis = a > 0.01;
  item.el.style.opacity = a.toFixed(3);
  item.el.style.visibility = vis ? 'visible' : 'hidden';
  if (item.interactive) item.el.style.pointerEvents = a > 0.5 ? 'auto' : 'none';
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // camera flight
  if (flight) {
    flight.t = Math.min(1, flight.t + dt / flight.dur);
    const k = ease(flight.t);
    cam.x = lerp(flight.from.x, flight.to.x, k);
    cam.y = lerp(flight.from.y, flight.to.y, k);
    cam.z = lerp(flight.from.z, flight.to.z, k) + flight.lift * Math.sin(Math.PI * k);
    if (flight.t >= 1) flight = null;
  }
  if (swayOn) {
    const sway = 0.012 * cam.z;
    camera.position.set(
      cam.x + pointer.x * cam.z * 0.035 + Math.sin(elapsed * 0.23) * sway,
      cam.y - pointer.y * cam.z * 0.035 + Math.cos(elapsed * 0.19) * sway * 0.6,
      cam.z);
  } else {
    camera.position.set(cam.x, cam.y, cam.z);
  }
  camera.lookAt(cam.x, cam.y, 0);

  // semantic zoom weights
  const tz = clamp((cam.z - Zf) / (Zo - Zf), -1, 2);
  const focusW = LOOPS.map(L => (1 - smooth(0.3, 0.72, tz)) * (1 - smooth(7, 13, Math.abs(cam.x - L.cx))));
  const dims = LOOPS.map((_, i) => 1 - 0.78 * Math.max(...focusW.filter((_, j) => j !== i), 0));
  [...panels, ...deeps].forEach(p => { p.k = clamp(p.k + (p.target ? dt : -dt) * 2.4, 0, 1); });
  const detail = LOOPS.map((_, i) => Math.max(0, ...panels.filter(p => p.loopIdx === i).map(p => ease(p.k))));
  const run = 1 - Math.max(...detail);   // 1 = free flow, 0 = a product panel is open
  solo = clamp(solo + (state.level === 'headline' ? dt : -dt) * 2.4, 0, 1);
  const rest = 1 - ease(solo);           // everything but the headline fades out while it is isolated
  const flowDt = dt * run;

  // WebGL dimming, hover & flow
  LOOPS.forEach((L, i) => {
    const d = dims[i] * (1 - 0.55 * detail[i]) * rest;
    L.ring.material.opacity = d;
    L.halo.material.opacity = 0.05 * d + (hovered === i ? 0.08 : 0);
    L.glow.material.opacity = (0.35 + 0.65 * d) * rest;
    L.hover.material.opacity = lerp(L.hover.material.opacity, hovered === i ? 1 : 0, Math.min(1, dt * 6));
    L.ring.material.dashOffset = (L.ring.material.dashOffset - FLOW_SPEED * flowDt) % 0.4189;

  connectors.forEach(c => {
    const d = Math.min(dims[c.between[0]], dims[c.between[1]]) * (1 - 0.6 * Math.max(detail[c.between[0]], detail[c.between[1]])) * rest;
    c.line.material.opacity = d; c.arrow.material.opacity = d; c.head.material.opacity = d; c.node.mat.opacity = d;
    c.line.material.dashOffset = (c.line.material.dashOffset - FLOW_SPEED * flowDt) % 0.4189;
    c.dim = d;
  });
  for (const n of [...nodes, ...connectors.map(c => c.node)]) {
    n.pulse = Math.max(0, n.pulse - dt * 1.6);   // cooldown only: no visual burst
    if (n.loop !== undefined) n.mat.opacity = dims[n.loop] * (1 - 0.55 * detail[n.loop]) * rest;
  }
  flows.forEach(f => {
    f.phase = (f.phase + FLOW_SPEED * flowDt / f.len) % 1;
    const base = f.connector ? f.connector.dim : dims[f.loop] * (1 - 0.55 * detail[f.loop]) * rest;
    f.chev.forEach((m, k) => {
      const u = (f.phase + k / f.n) % 1;
      f.at(u, _p, _t);
      m.position.copy(_p);
      m.rotation.z = Math.atan2(_t.y, _t.x);
      m.material.opacity = base * (f.fadeEnds ? smooth(0, 0.12, u) * (1 - smooth(0.88, 1, u)) : 1);
    });
  });

  // tokens
  spawnTimer -= flowDt;
  if (spawnTimer <= 0) { spawnJourney(); spawnTimer = 3.4; }
  tokens.forEach(tk => advanceToken(tk, flowDt));
  for (let k = tokens.length - 1; k >= 0; k--) if (tokens[k].fade <= 0) tokens.splice(k, 1);
  writeTokens(dims, run * rest);

  // CSS3D opacity per semantic level
  for (const it of cssItems) {
    let a = 1;
    switch (it.kind) {
      case 'title': a = Math.max(smooth(0.35, 0.8, tz), ease(solo)); it.el.classList.toggle('live', a > 0.5); break;
      case 'connector': a = Math.min(dims[it.between[0]], dims[it.between[1]]) * (1 - 0.7 * Math.max(...detail)); break;
      case 'loopStatic': a = dims[it.loop] * (1 - 0.7 * detail[it.loop]); break;
      case 'wordmark': a = (1 - smooth(0.15, 0.85, focusW[it.loop])) * dims[it.loop]; break;
      case 'focus': a = smooth(0.25, 0.9, focusW[it.loop]) * (1 - 0.88 * detail[it.loop]); break;
      case 'panel': {
        const k = ease(it.k);
        it.o.position.lerpVectors(it.from, _p.set(LOOPS[it.loopIdx].cx, PY, PZ), k);
        it.o.scale.setScalar(lerp(it.fromScale, S, k));
        a = smooth(0, 0.6, it.k) * (1 - Math.max(0, ...it.deeps.map(d => ease(d.k))));   // gives way to its deep dives
        break;
      }
      case 'deep': {
        const k = ease(it.k), cx = LOOPS[it.loopIdx].cx;
        it.o.position.set(cx, PY, lerp(PZ, PZ + DZ, k));
        it.o.scale.setScalar(S * lerp(0.92, 1, k));
        a = smooth(0.2, 0.8, it.k);
        break;
      }
    }
    setOpacity(it, it.kind === 'title' ? a : a * rest);
  }

  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
